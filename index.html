<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Super Winner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1d33">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold1:#ffe2a0; --gold2:#f0b95a; --gold3:#d98d34;
    --teal:#3fa6b8; --text-blue:#8ec9e6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a1830}
  body{
    font-family:"Segoe UI",Candara,"Trebuchet MS",system-ui,sans-serif;
    background:
      radial-gradient(ellipse 70% 35% at 50% 18%, rgba(40,110,120,.55), transparent 70%),
      radial-gradient(ellipse 90% 50% at 50% 30%, rgba(20,60,80,.6), transparent 75%),
      linear-gradient(180deg,#0b1d2e 0%,#0b1c33 45%,#0a1833 100%);
  }
  #stars{position:fixed;inset:0;pointer-events:none}
  #viewport{position:fixed;inset:0;display:flex;justify-content:center;overflow:hidden}
  .stage{position:absolute;top:0;width:360px;height:804px;transform-origin:top center}
  .screen{position:absolute;inset:0;display:none}
  .screen.active{display:block}
  .abs{position:absolute}

  /* Header */
  .title{left:0;right:0;top:38px;text-align:center;font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:900;
    font-size:23.5px;letter-spacing:1px;color:#f5c66e;
    background:linear-gradient(180deg,#fff0c0 0%,#f6c56a 50%,#d8963c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 0 #6b3a12) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .icon-btn{background:none;border:none;cursor:pointer;width:24px;height:24px;top:45px}
  .icon-btn svg{width:100%;height:100%}

  /* Wooden board */
  .pin{left:168px;top:136px;width:25px;height:25px;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 40% 35%,#c08878,#8a5446 60%,#5e3328);border:2px solid #f0b46c;box-shadow:0 2px 4px rgba(0,0,0,.5)}
  .rope{left:180px;top:147px;height:4px;width:170px;transform-origin:0 50%;z-index:2;border-radius:2px;
    background:repeating-linear-gradient(60deg,#f2c58e 0 2px,#b77a45 2px 4px);box-shadow:0 1px 2px rgba(0,0,0,.5)}
  .rope.l{transform:rotate(146.3deg)} .rope.r{transform:rotate(33.7deg)}
  .board{left:8px;top:227px;width:344px;height:215px;border-radius:5px;z-index:1;
    border:2px solid #f0b178;
    background:
      repeating-linear-gradient(178deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px),
      linear-gradient(180deg,#8d4d33 0%,#97553a 45%,#b76a4a 85%,#c0744f 100%);
    box-shadow:inset 0 0 0 2px #7a3f27,inset 0 -6px 10px rgba(255,190,140,.25),0 4px 12px rgba(0,0,0,.6)}
  .hole{width:11px;height:11px;border-radius:50%;background:#0e3f4a;box-shadow:inset 0 2px 2px rgba(0,0,0,.6);z-index:2}
  .field{left:24px;width:312px;height:40px;border-radius:5px;z-index:2;display:flex;align-items:center;
    background:#6b3628;border:1px solid #5a2c20;border-bottom:2px solid #b36f50;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
  .field .ic{width:18px;height:20px;margin-left:9px;flex:none}
  .field .cc{color:#f7e8dc;font-size:12.5px;margin-left:5px;flex:none}
  .field input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:#fff0e4;font-size:13px;font-family:inherit;padding:0 6px}
  .field input::placeholder{color:#c0937e}
  .field .pad{margin-left:28px}
  .field .end{background:none;border:none;cursor:pointer;width:22px;height:22px;margin-right:9px;flex:none;display:flex;align-items:center;justify-content:center}
  .forgot{right:28px;top:389px;z-index:2;color:#f8dcb4;font-size:12px;background:none;border:none;cursor:pointer;font-family:inherit}

  /* Gold buttons */
  .gbtn{cursor:pointer;border:none;color:#fff;font-family:inherit;letter-spacing:.3px;
    background:linear-gradient(180deg,#f2bf63 0%,#e3a24a 45%,#dc9238 100%);
    border-top:2px solid var(--gold1);border-left:2px solid var(--gold1);
    border-radius:10px 0 12px 0;box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 -2px 3px rgba(150,80,10,.35);
    text-shadow:0 1px 1px rgba(120,60,10,.4)}
  .gbtn:active{filter:brightness(.92);transform:translateY(1px)}
  .gbtn:disabled{filter:grayscale(.4) brightness(.85);cursor:default}
  .main-btn{left:94px;top:461px;width:169px;height:32px;font-size:13.5px;z-index:2}
  #register .board{height:275px} #register .main-btn{top:521px} #register .bottom{top:575px}   /* invite code wala 4th box */
  .otp-btn{width:81px;height:24px;font-size:12.5px;margin-right:7px;flex:none}
  .bottom{left:0;right:0;top:515px;display:flex;justify-content:center;gap:26px;font-size:12px}
  .bottom span{color:var(--text-blue)}
  .bottom a{color:#e8735a;text-decoration:underline;cursor:pointer}

  /* Forgot page */
  .fp-head{left:0;right:0;top:0;height:71px;border-bottom:2px solid #1d8ea0;background:linear-gradient(180deg,#0a1520,#0b1c29)}
  .back{left:13px;top:44px;width:18px;height:18px;transform:rotate(45deg);background:linear-gradient(135deg,#2fa0b0,#14707f);border:none;cursor:pointer}
  .back svg{transform:rotate(-45deg);width:100%;height:100%}
  .fp-title{left:0;right:0;top:41px;text-align:center;font-family:Cinzel,Georgia,serif;font-weight:900;font-size:17px;color:var(--teal);letter-spacing:.5px}
  .tfield{left:20px;width:320px;height:61px;display:flex;align-items:center;border-radius:3px;
    background:linear-gradient(180deg,rgba(40,65,90,.85),rgba(30,55,78,.75));border-bottom:2px solid #1e8a9a}
  .tfield::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);background:#3cc2d4;box-shadow:0 0 6px #3cc2d4}
  .tfield .ic{width:18px;height:20px;margin-left:12px;flex:none}
  .tfield .cc{color:var(--text-blue);font-family:Georgia,serif;font-size:13px;margin-left:5px;flex:none}
  .tfield input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:#d8f0fa;font-size:13px;font-family:inherit;padding:0 6px}
  .tfield input::placeholder{color:#79b4cc}
  .tfield .pad{margin-left:28px}
  .tfield .end{background:none;border:none;cursor:pointer;width:22px;height:22px;margin-right:12px;flex:none;display:flex;align-items:center;justify-content:center}
  .tfield .otp-btn{margin-right:10px}
  .submit-btn{left:96px;top:442px;width:169px;height:28px;font-size:14px}

  /* Language modal */
  .overlay{position:absolute;left:-1000px;right:-1000px;top:-1000px;bottom:-1000px;background:rgba(0,0,0,.72);display:none;z-index:20}
  .overlay.show{display:block}
  .modal{left:46px;top:267px;width:268px;height:184px;z-index:21;display:none;
    background:linear-gradient(180deg,#123a5c 0%,#0f3355 60%,#145183 100%);border:2px solid #3a7fb0;border-top:2px solid #e4c06a;
    box-shadow:0 0 0 1px #0a2540,0 8px 24px rgba(0,0,0,.7),inset 0 -6px 14px rgba(70,170,230,.35)}
  .modal.show{display:block}
  .modal h3{text-align:center;color:#fff;font-size:14px;font-weight:800;margin-top:8px;letter-spacing:.3px}
  .modal .x{position:absolute;right:4px;top:4px;width:18px;height:18px;background:none;border:none;cursor:pointer}
  .langlist{position:absolute;left:6px;right:6px;top:28px;height:103px;background:#152a45;border:1px solid #1f4566;padding:15px 8px 0}
  .lang{display:block;width:100%;height:29px;background:none;border:none;border-bottom:1px solid #2a4a5e;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:4px}
  .lang.sel{background:#173c55;border:1px solid #2fc0cc;color:#58d6d6}
  .confirm-btn{position:absolute;left:94px;top:144px;width:80px;height:24px;font-size:12.5px}

  /* Support box */
  .smodal{left:22px;top:190px;width:316px;z-index:21;display:none;padding:12px 12px 14px;
    background:linear-gradient(180deg,#123a5c 0%,#0f3355 60%,#145183 100%);border:2px solid #3a7fb0;border-top:2px solid #e4c06a;
    box-shadow:0 0 0 1px #0a2540,0 8px 24px rgba(0,0,0,.7),inset 0 -6px 14px rgba(70,170,230,.35)}
  .smodal.show{display:block}
  .smodal h3{text-align:center;color:#fff;font-size:14px;font-weight:800;letter-spacing:.3px;margin-bottom:4px}
  .smodal p{color:#9cc9e2;font-size:11.5px;text-align:center;margin-bottom:10px}
  .smodal .x{position:absolute;right:4px;top:4px;width:18px;height:18px;background:none;border:none;cursor:pointer}
  .sin{width:100%;background:#152a45;border:1px solid #1f4566;color:#e8f4ff;font-family:inherit;font-size:13px;padding:9px 10px;margin-bottom:8px;outline:none;border-radius:3px}
  .sin::placeholder{color:#79a6c2}
  textarea.sin{height:110px;resize:none;line-height:1.4}
  .ssend{display:block;margin:6px auto 0;width:120px;height:28px;font-size:13px}
  .toast{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:14px;
    padding:9px 16px;border-radius:6px;display:none;z-index:40;max-width:80vw;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* title text upar wale buttons ko dhak na de */
  .title,.fp-title,.fp-head{pointer-events:none}
  .icon-btn,.back{z-index:5}
  .back::before{content:"";position:absolute;inset:-10px}

  /* Download App (APK) */
  .dl-btn{left:110px;width:140px;height:30px;z-index:2;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;text-decoration:none;border-radius:15px}
  .dl-btn svg{width:15px;height:15px;flex:none}
  .dl-btn.hide{display:none}
  /* Koi bhi focus box/outline nahi dikhega */
  *:focus,*:focus-visible,input:focus,input:focus-visible,textarea:focus,textarea:focus-visible,select:focus,button:focus,button:focus-visible,a:focus{outline:none!important;box-shadow:none!important;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<!-- SVG icon defs -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/><stop offset=".5" stop-color="#f1c06a"/><stop offset="1" stop-color="#c9893a"/>
    </linearGradient>
    <symbol id="i-phone" viewBox="0 0 18 24"><rect x="1" y="1" width="16" height="22" rx="2.5" fill="url(#g)" stroke="#a8692a" stroke-width=".8"/><rect x="3.5" y="4.5" width="11" height="12" rx="1.5" fill="#fff6dc" stroke="#7a4a1c" stroke-width="1"/><rect x="7" y="2.3" width="4" height=".9" fill="#7a4a1c"/><circle cx="9" cy="19.6" r="1" fill="#7a4a1c"/></symbol>
    <symbol id="i-lock" viewBox="0 0 20 24"><path d="M5 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="url(#g)" stroke-width="2.6"/><ellipse cx="10" cy="16" rx="9" ry="7.2" fill="url(#g)" stroke="#b07330" stroke-width=".6"/><rect x="9" y="14" width="2" height="4" rx="1" fill="#5a3412"/></symbol>
    <symbol id="i-shield" viewBox="0 0 20 24"><path d="M10 1 L19 4 V12 C19 17 14 21 10 23 C6 21 1 17 1 12 V4 Z" fill="url(#g)" stroke="#b07330" stroke-width=".6"/><path d="M5.5 11.5 L9 15 L15 8" fill="none" stroke="#5a3412" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye-closed" viewBox="0 0 24 16"><path d="M2 4 C7 11 17 11 22 4" fill="none" stroke="#f4c56e" stroke-width="2.2" stroke-linecap="round"/><path d="M6 9 L4 13 M12 10.5 V14.5 M18 9 L20 13 M2 4 L1 2 M22 4 L23 2" stroke="#f4c56e" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-eye-open" viewBox="0 0 24 16"><path d="M1.5 8 C6 1 18 1 22.5 8 C18 15 6 15 1.5 8 Z" fill="none" stroke="#f4c56e" stroke-width="2"/><circle cx="12" cy="8" r="3.2" fill="#f4c56e"/></symbol>
    <symbol id="i-gift" viewBox="0 0 22 22"><rect x="2.5" y="9.5" width="17" height="11" rx="1.5" fill="url(#g)" stroke="#b07330" stroke-width=".6"/><rect x="1.5" y="6" width="19" height="4" rx="1" fill="url(#g)" stroke="#b07330" stroke-width=".6"/><path d="M11 6v14.5" stroke="#5a3412" stroke-width="1.8"/><path d="M11 6C9.5 2.5 5.5 2 6 4.6 6.3 6 9 6 11 6M11 6c1.5-3.5 5.5-4 5-1.4C15.7 6 13 6 11 6" fill="none" stroke="#b07330" stroke-width="1.3"/></symbol>
    <symbol id="i-x" viewBox="0 0 20 20"><path d="M3 3 L17 17 M17 3 L3 17" stroke="#fff4e4" stroke-width="2.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="viewport">
<div class="stage" id="stage">

  <!-- ================= LOGIN ================= -->
  <section class="screen" id="login">
    <button class="abs icon-btn lang-open" style="left:13px" aria-label="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#1a1406" stroke="url(#g)" stroke-width="2"/><path d="M6 6 C9 5 10 8 8 10 C6 12 9 14 8 17 C5 15 4 11 6 6 Z M13 4 C16 5 19 8 19 11 C17 10 16 12 17 14 C15 16 14 19 13 20 C12 17 14 15 12 13 C10 11 12 8 13 4 Z" fill="url(#g)"/></svg></button>
    <button class="abs icon-btn" style="right:13px" aria-label="Support"><svg viewBox="0 0 24 24"><path d="M3.5 13 V11 A8.5 8.5 0 0 1 20.5 11 V13" fill="none" stroke="url(#g)" stroke-width="2.4"/><rect x="1.5" y="11" width="4.5" height="7" rx="2" fill="url(#g)"/><rect x="18" y="11" width="4.5" height="7" rx="2" fill="url(#g)"/><circle cx="12" cy="12.5" r="5" fill="url(#g)"/><path d="M8 11 C10 8 14 8 16 11" fill="none" stroke="#1a1406" stroke-width="1.4"/><path d="M20 17 C19 21 15 22 12 22" fill="none" stroke="url(#g)" stroke-width="1.8"/></svg></button>
    <div class="abs title">SUPER WINNER</div>

    <div class="abs rope l"></div><div class="abs rope r"></div><div class="abs pin"></div>
    <div class="abs board"></div>
    <div class="abs hole" style="left:33px;top:236px"></div><div class="abs hole" style="left:316px;top:236px"></div>

    <div class="abs field" style="top:274px">
      <svg class="ic"><use href="#i-phone"/></svg><span class="cc">+ 91</span>
      <input class="pad" style="margin-left:4px" id="l-phone" type="tel" inputmode="numeric" maxlength="10" data-ph="phone">
      <button class="end clear" data-for="l-phone" aria-label="Clear"><svg width="13" height="13"><use href="#i-x"/></svg></button>
    </div>
    <div class="abs field" style="top:338px">
      <svg class="ic" style="width:19px"><use href="#i-lock"/></svg>
      <input class="pad" id="l-pass" type="password" data-ph="password">
      <button class="end eye" data-for="l-pass" aria-label="Show password"><svg width="17" height="12"><use href="#i-eye-closed"/></svg></button>
    </div>
    <button class="abs forgot" data-go="forgot" data-t="forgot"></button>

    <button class="abs gbtn main-btn" id="btn-login" data-t="login"></button>
    <div class="abs bottom"><span data-t="newUser"></span><a data-go="register" data-t="join"></a></div>
    <a class="abs gbtn dl-btn" href="super-winner.apk" download="Super Winner.apk" style="top:560px"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="dlApp"></span></a>
  </section>

  <!-- ================= REGISTER ================= -->
  <section class="screen" id="register">
    <button class="abs icon-btn lang-open" style="left:13px" aria-label="Language"><svg viewBox="0 0 24 24"><use href="#globe"/></svg></button>
    <button class="abs icon-btn" style="right:13px" aria-label="Support"><svg viewBox="0 0 24 24"><use href="#headset"/></svg></button>
    <div class="abs title">SUPER WINNER</div>

    <div class="abs rope l"></div><div class="abs rope r"></div><div class="abs pin"></div>
    <div class="abs board"></div>
    <div class="abs hole" style="left:33px;top:236px"></div><div class="abs hole" style="left:316px;top:236px"></div>

    <div class="abs field" style="top:257px">
      <svg class="ic"><use href="#i-phone"/></svg><span class="cc">+ 91</span>
      <input style="margin-left:4px" id="r-phone" type="tel" inputmode="numeric" maxlength="10" data-ph="phone">
      <button class="end clear" data-for="r-phone" aria-label="Clear"><svg width="13" height="13"><use href="#i-x"/></svg></button>
    </div>
    <div class="abs field" style="top:317px">
      <svg class="ic" style="width:19px"><use href="#i-lock"/></svg>
      <input class="pad" id="r-pass" type="password" data-ph="password">
      <button class="end eye" data-for="r-pass" aria-label="Show password"><svg width="17" height="12"><use href="#i-eye-closed"/></svg></button>
    </div>
    <div class="abs field" style="top:377px">
      <svg class="ic"><use href="#i-shield"/></svg>
      <input class="pad" style="margin-left:22px" id="r-otp" type="tel" inputmode="numeric" maxlength="6" data-ph="otp">
      <button class="gbtn otp-btn send-otp" data-phone="r-phone" data-purpose="register" data-t="otp"></button>
    </div>
    <div class="abs field" style="top:437px">
      <svg class="ic"><use href="#i-gift"/></svg>
      <input class="pad" id="r-ref" maxlength="8" autocomplete="off" autocapitalize="characters" data-ph="invite" style="text-transform:uppercase">
    </div>

    <button class="abs gbtn main-btn" id="btn-register" data-t="register"></button>
    <div class="abs bottom"><span data-t="already"></span><a data-go="login" data-t="loginLink"></a></div>
    <a class="abs gbtn dl-btn" href="super-winner.apk" download="Super Winner.apk" style="top:618px"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="dlApp"></span></a>
  </section>

  <!-- ================= FORGOT PASSWORD ================= -->
  <section class="screen" id="forgot">
    <div class="abs fp-head"></div>
    <button class="abs back" data-go="login" aria-label="Back"><svg viewBox="0 0 18 18"><path d="M10.5 4.5 L6 9 L10.5 13.5" fill="none" stroke="#9ff0f8" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="abs fp-title" data-t="fpTitle"></div>

    <div class="abs tfield" style="top:110px">
      <svg class="ic"><use href="#i-phone"/></svg><span class="cc">+ 91</span>
      <input id="f-phone" type="tel" inputmode="numeric" maxlength="10" data-ph="inputPhone">
    </div>
    <div class="abs tfield" style="top:182px">
      <svg class="ic"><use href="#i-shield"/></svg>
      <input class="pad" style="margin-left:26px" id="f-otp" type="tel" inputmode="numeric" maxlength="6" data-ph="inputOtp">
      <button class="gbtn otp-btn send-otp" data-phone="f-phone" data-purpose="reset" data-t="otp"></button>
    </div>
    <div class="abs tfield" style="top:253px">
      <svg class="ic" style="width:19px"><use href="#i-lock"/></svg>
      <input class="pad" style="margin-left:26px" id="f-pass" type="password" data-ph="password">
      <button class="end eye" data-for="f-pass" aria-label="Show password"><svg width="17" height="12"><use href="#i-eye-closed"/></svg></button>
    </div>

    <button class="abs gbtn submit-btn" id="btn-submit" data-t="submit"></button>
  </section>

  <div class="overlay" id="overlay"></div>
  <!-- ================= SUPPORT BOX ================= -->
  <div class="abs smodal" id="smodal">
    <h3 data-t="supTitle"></h3>
    <p data-t="supNote"></p>
    <button class="x" id="smodal-x" aria-label="Close"><svg viewBox="0 0 20 20"><path d="M4 4 L16 16 M16 4 L4 16" stroke="#f6d48a" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <input class="sin" id="s-phone" type="tel" inputmode="numeric" maxlength="10" data-ph="supPhone">
    <textarea class="sin" id="s-desc" maxlength="500" data-ph="supDesc"></textarea>
    <button class="gbtn ssend" id="s-send" data-t="supSend"></button>
  </div>
  <!-- ================= LANGUAGE MODAL ================= -->
  <div class="abs modal" id="modal">
    <h3 data-t="language"></h3>
    <button class="x" id="modal-x" aria-label="Close"><svg viewBox="0 0 20 20"><path d="M4 4 L16 16 M16 4 L4 16" stroke="#f6d48a" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="langlist">
      <button class="lang" data-lang="en">English</button>
      <button class="lang" data-lang="hi">हिंदी</button>
    </div>
    <button class="gbtn confirm-btn" id="modal-ok" data-t="confirm"></button>
  </div>

</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== Backend endpoints (apne server ke hisaab se badlo) ===== */
const API = {
  sendOtp:   'send-otp.php',     // POST: phone, purpose
  verifyOtp: 'verify-otp.php',   // POST: phone, otp

/* ===== API helper ===== */
/* Demo mode: jab PHP server na mile (jaise Claude preview), sab kuch browser me hi chalta hai */
const demo = { users:{}, otps:{} };
try{ demo.users = JSON.parse(localStorage.getItem('sw_users')||'{}'); }catch(e){}
function saveUsers(){ try{ localStorage.setItem('sw_users', JSON.stringify(demo.users)); }catch(e){} }
function demoApi(url, d){
  const L = lang==='hi';
  if(url===API.sendOtp){
    if(d.purpose==='register' && demo.users[d.phone]) return {success:false, message:L?'यह नंबर पहले से रजिस्टर है':'This number is already registered'};
    if(d.purpose==='reset' && !demo.users[d.phone]) return {success:false, message:L?'यह नंबर रजिस्टर नहीं है':'This number is not registered'};
    const code = String(Math.floor(100000+Math.random()*900000));
    demo.otps[d.phone] = code;
    return {success:true, message:(L?'डेमो OTP: ':'Demo OTP: ')+code};
  }
  if(url===API.verifyOtp){
    return demo.otps[d.phone] && demo.otps[d.phone]===d.otp ? {success:true}
      : {success:false, message:L?'गलत OTP':'Wrong OTP'};
  }
  if(url===API.register){
    if(demo.users[d.phone]) return {success:false, message:L?'यह नंबर पहले से रजिस्टर है':'This number is already registered'};
    demo.users[d.phone]=d.password; saveUsers(); delete demo.otps[d.phone];
    try{ if(!localStorage.getItem('sw_wb_'+d.phone)) localStorage.setItem('sw_wb_'+d.phone,'1'); }catch(e){}   // test: ₹50 bonus (sirf ek baar)
    return {success:true, message:L?'रजिस्ट्रेशन सफल! ₹50 बोनस मिला':'Registered! ₹50 bonus added'};
  }
  if(url===API.login){
    if(!demo.users[d.phone]) return {success:false, message:L?'यह नंबर रजिस्टर नहीं है':'This number is not registered'};
    return demo.users[d.phone]===d.password ? {success:true, message:L?'लॉगिन सफल':'Login successful'}
      : {success:false, message:L?'गलत पासवर्ड':'Wrong password'};
  }
  if(url===API.support2) return {success:true, message:L?'संदेश भेज दिया गया (टेस्ट)':'Message sent! (test file)'};
  if(url===API.reset){
    if(!demo.users[d.phone]) return {success:false, message:L?'यह नंबर रजिस्टर नहीं है':'This number is not registered'};
    demo.users[d.phone]=d.password; saveUsers(); delete demo.otps[d.phone];
    return {success:true, message:L?'पासवर्ड बदल दिया गया':'Password changed'};
  }
  return {success:false};
}
/* Demo sirf preview/file me; asli server (http/https) par hamesha real PHP API */
const IS_PREVIEW = !/^https?:$/.test(location.protocol);
// Pehle se login hai (is phone par) to login page mat dikhao, seedha Home. Session khatam ho to home.html khud wapas yahan bhej deta hai.
if(!IS_PREVIEW){ try{ if(localStorage.getItem('sw_phone')) location.replace(API.afterLogin || 'home.html'); }catch(e){} }
async function post(url, data){
  try{
    const fd = new FormData(); Object.entries(data).forEach(([k,v]) => fd.append(k,v));
    const res = await fetch(url, {method:'POST', body:fd});
    if(res.status===404 && IS_PREVIEW) return demoApi(url, data);
    const txt = await res.text();
    try { return JSON.parse(txt); } catch { return {success: res.ok, message: txt}; }
  }catch(e){ if(IS_PREVIEW) return demoApi(url, data); throw e; }
}
const okPhone = p => /^[6-9]\d{9}$/.test(p);

/* ===== OTP send with countdown ===== */
$$('.send-otp').forEach(btn => btn.addEventListener('click', async () => {
  const phone = document.getElementById(btn.dataset.phone).value.trim();
  if(!okPhone(phone)) return toast(t('badPhone'));
  // turant "OTP sent" + countdown (server ka intezaar nahi); server mana kare to wapas
  btn.disabled = true; toast(t('otpSent'));
  let s = OTP_WAIT; btn.dataset.counting = 1; btn.textContent = s+'s';
  const iv = setInterval(() => {
    s--; btn.textContent = s+'s';
    if(s<=0) stop();
  },1000);
  function stop(){ clearInterval(iv); delete btn.dataset.counting; btn.disabled=false; btn.textContent=t('otp'); }
  try{
    const r = await post(API.sendOtp, {phone, purpose: btn.dataset.purpose || ''});
    if(r.success === false){ stop(); return toast(r.message || t('netErr')); }
    if(r.message && r.message!=='OTP sent') toast(r.message);   // test file ka "Demo OTP: 1234"
  }catch(e){ stop(); toast(t('netErr')); }
}));

/* ===== Login ===== */
$('#btn-login').addEventListener('click', async () => {
  const phone=$('#l-phone').value.trim(), password=$('#l-pass').value;
  if(!okPhone(phone)) return toast(t('badPhone'));
  if(password.length<6) return toast(t('badPass'));
  try{ const r = await post(API.login,{phone,password}); toast(r.message || (r.success?'OK':t('netErr'))); if(r.success){ try{ localStorage.setItem('sw_phone', phone); }catch(e){} if(API.afterLogin) location.href = API.afterLogin; } }
  catch(e){ toast(t('netErr')); }
});

/* ===== Register ===== */
$('#btn-register').addEventListener('click', async () => {
  const phone=$('#r-phone').value.trim(), password=$('#r-pass').value, otp=$('#r-otp').value.trim();
  if(!okPhone(phone)) return toast(t('badPhone'));
  if(password.length<6) return toast(t('badPass'));
  if(!otp) return toast(t('badOtp'));
  try{
    const v = await post(API.verifyOtp,{phone,otp});
    if(v.success === false) return toast(v.message || t('netErr'));
    const ref = $('#r-ref').value.trim().toUpperCase();
    const r = await post(API.register,{phone,password,otp,ref});
    toast(r.message || (r.success?'OK':t('netErr')));
    if(r.success){ try{ localStorage.removeItem('sw_ref'); }catch(e){} if(r.login){ try{ localStorage.setItem('sw_phone', phone); }catch(e){} location.href = API.afterLogin || 'home.html'; } else show('login'); }
  }catch(e){ toast(t('netErr')); }
});
$('#r-ref').addEventListener('input',e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });

/* ===== Forgot password ===== */
$('#btn-submit').addEventListener('click', async () => {
  const phone=$('#f-phone').value.trim(), otp=$('#f-otp').value.trim(), password=$('#f-pass').value;
  if(!okPhone(phone)) return toast(t('badPhone'));
  if(!otp) return toast(t('badOtp'));
  if(password.length<6) return toast(t('badPass'));
  try{
    const v = await post(API.verifyOtp,{phone,otp});
    if(v.success === false) return toast(v.message || t('netErr'));
    const r = await post(API.reset,{phone,password,otp});
    toast(r.message || (r.success?'OK':t('netErr')));
    if(r.success) show('login');
  }catch(e){ toast(t('netErr')); }
});

});
